<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - CogniWave</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="dashboard.css" rel="stylesheet"/>
    <script src="tailwind-config.js"></script>
    <!-- Centralized Navigation -->
    <script src="navbar.js"></script>
</head>
<body class="bg-bg text-gray-800 font-sans min-h-screen p-6 pt-28">
    <!-- Navigation Container -->
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-4xl font-bold text-gray-900 mb-2">Analytics</h2>
                <p class="text-gray-500 text-lg">View your complete emotion and health records</p>
            </div>
            <div class="flex gap-3">
                <input type="text" placeholder="Search records..." 
                       class="px-4 py-2 rounded-full border border-gray-300 focus:outline-none focus:border-blue-500">
                <button class="bg-primary text-white px-6 py-2 rounded-full font-semibold hover:bg-primary-dark transition-colors">
                    <i class="fas fa-download mr-2"></i> Export
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Filters Sidebar -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-3xl shadow-sm sticky top-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">Filters</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-semibold text-gray-700 mb-2 block">Date Range</label>
                            <select class="w-full bg-gray-100 rounded-lg px-4 py-2 text-sm border-none">
                                <option>Last 30 days</option>
                                <option>Last 3 months</option>
                                <option>Last 6 months</option>
                                <option>Last year</option>
                                <option>All time</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-sm font-semibold text-gray-700 mb-2 block">Record Type</label>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" checked class="rounded text-blue-600 mr-2">
                                    <span class="text-sm text-gray-700">Appointments</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" checked class="rounded text-blue-600 mr-2">
                                    <span class="text-sm text-gray-700">Medications</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" checked class="rounded text-blue-600 mr-2">
                                    <span class="text-sm text-gray-700">Lab Results</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="rounded text-blue-600 mr-2">
                                    <span class="text-sm text-gray-700">Prescriptions</span>
                                </label>
                            </div>
                        </div>

                        <button class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-200 mt-4">
                            Clear Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Timeline -->
            <div id="historyTimeline" class="lg:col-span-3 space-y-6">
                <!-- Loading state -->
                <div id="loadingState" class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
                </div>

                <!-- Empty state -->
                <div id="emptyState" class="hidden text-center py-12">
                    <i class="fas fa-file-medical text-gray-300 text-6xl mb-4"></i>
                    <h3 class="text-xl font-bold text-gray-900 mb-2">No Records Found</h3>
                    <p class="text-gray-500">Start by creating your first session in the Emotion Lab or Diagnostics page.</p>
                </div>

                <!-- Records will be populated here dynamically -->
            </div>
        </div>
    </main>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        // Fetch and display all reports
        async function loadHistoryRecords() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/reports/all`);
                const data = await response.json();
                
                document.getElementById('loadingState').classList.add('hidden');
                
                if (data.total_reports === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }
                
                displayRecords(data.reports);
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }
        
        function displayRecords(reports) {
            const timeline = document.getElementById('historyTimeline');
            const groupedReports = groupReportsByMonth(reports);
            
            let html = '';
            for (const [monthYear, records] of Object.entries(groupedReports)) {
                html += `
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 mb-4">${monthYear}</h3>
                        <div class="space-y-4">
                            ${records.map(record => createRecordCard(record)).join('')}
                        </div>
                    </div>
                `;
            }
            
            timeline.innerHTML = html;
        }
        
        function groupReportsByMonth(reports) {
            const grouped = {};
            reports.forEach(report => {
                const date = new Date(report.created_at);
                const monthYear = date.toLocaleString('default', { month: 'long', year: 'numeric' }).toUpperCase();
                if (!grouped[monthYear]) {
                    grouped[monthYear] = [];
                }
                grouped[monthYear].push(report);
            });
            return grouped;
        }
        
        function createRecordCard(record) {
            const date = new Date(record.created_at);
            const formattedDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const formattedTime = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            const priorityColors = {
                'low': 'bg-green-100 text-green-800',
                'medium': 'bg-yellow-100 text-yellow-800',
                'high': 'bg-red-100 text-red-800'
            };
            
            const iconColors = {
                'low': 'bg-green-100 text-green-600',
                'medium': 'bg-yellow-100 text-yellow-600',
                'high': 'bg-red-100 text-red-600'
            };
            
            const priorityColor = priorityColors[record.priority_level] || 'bg-gray-100 text-gray-800';
            const iconColor = iconColors[record.priority_level] || 'bg-gray-100 text-gray-600';
            
            return `
                <div class="bg-white p-6 rounded-3xl shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex gap-4">
                        <div class="flex flex-col items-center">
                            <div class="w-12 h-12 ${iconColor} rounded-full flex items-center justify-center">
                                <i class="fas fa-brain"></i>
                            </div>
                            <div class="w-0.5 h-full bg-gray-200 mt-2"></div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h4 class="text-lg font-bold text-gray-900">
                                        ${record.analysis_id.startsWith('EMOTION-') ? 'Emotion Analysis' : 'Medical Analysis'} - ${record.patient.full_name || 'Unknown Participant'}
                                    </h4>
                                    <p class="text-sm text-gray-500">
                                        ${record.patient.gender || 'Unknown'}, 
                                        ${record.patient.age ? 'Age ' + record.patient.age : 'Age N/A'} 
                                        - ${record.analysis_id}
                                    </p>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm text-gray-400">${formattedDate}</div>
                                    <div class="text-xs text-gray-400">${formattedTime}</div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                                ${record.vital_signs.heart_rate ? `
                                    <div class="flex items-center">
                                        <i class="fas fa-heartbeat text-red-500 mr-2"></i>
                                        <span class="text-gray-600">HR: ${record.vital_signs.heart_rate} bpm</span>
                                    </div>
                                ` : ''}
                                ${record.vital_signs.blood_pressure ? `
                                    <div class="flex items-center">
                                        <i class="fas fa-tint text-blue-500 mr-2"></i>
                                        <span class="text-gray-600">BP: ${record.vital_signs.blood_pressure} mmHg</span>
                                    </div>
                                ` : ''}
                                ${record.vital_signs.temperature ? `
                                    <div class="flex items-center">
                                        <i class="fas fa-thermometer-half text-orange-500 mr-2"></i>
                                        <span class="text-gray-600">Temp: ${record.vital_signs.temperature}°C</span>
                                    </div>
                                ` : ''}
                                ${record.vital_signs.oxygen_saturation ? `
                                    <div class="flex items-center">
                                        <i class="fas fa-lungs text-teal-500 mr-2"></i>
                                        <span class="text-gray-600">SpO2: ${record.vital_signs.oxygen_saturation}%</span>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="flex gap-2 items-center">
                                <span class="${priorityColor} text-xs font-semibold px-3 py-1 rounded-full">
                                    ${record.priority_level.toUpperCase()} Priority
                                </span>
                                ${record.requires_attention ? `
                                    <span class="bg-red-100 text-red-800 text-xs font-semibold px-3 py-1 rounded-full">
                                        <i class="fas fa-exclamation-triangle mr-1"></i>Requires Attention
                                    </span>
                                ` : ''}
                                ${record.pdf_url ? `
                                    <a href="${API_BASE_URL}${record.pdf_url}" target="_blank" 
                                       class="text-blue-600 text-sm font-semibold hover:text-blue-700 flex items-center">
                                        <i class="fas fa-download mr-1"></i>Download PDF
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Load records when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadHistoryRecords();
        });
    </script>
    <script src="dashboard.js"></script>
</body>
</html>
