<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - CogniWave</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="dashboard.css" rel="stylesheet"/>
    <script src="tailwind-config.js"></script>
    <!-- Centralized Navigation -->
    <script src="navbar.js"></script>
</head>
<body class="bg-bg text-gray-800 font-sans min-h-screen p-6 pt-28">
    <!-- Navigation Container -->
    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto">
        <div class="mb-8">
            <h2 class="text-4xl font-bold text-gray-900 mb-2">Schedule</h2>
            <p class="text-gray-500 text-lg">Chat history log with AI / Doctor</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Calendar Section -->
            <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold text-gray-900" id="currentMonth">January 2026</h3>
                    <div class="flex gap-2">
                        <button id="prevMonth" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200">
                            <i class="fas fa-chevron-left text-gray-600"></i>
                        </button>
                        <button id="nextMonth" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200">
                            <i class="fas fa-chevron-right text-gray-600"></i>
                        </button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-2 mb-4">
                    <div class="text-center text-xs font-semibold text-gray-500 py-2">Sun</div>
                    <div class="text-center text-xs font-semibold text-gray-500 py-2">Mon</div>
                    <div class="text-center text-xs font-semibold text-gray-500 py-2">Tue</div>
                    <div class="text-center text-xs font-semibold text-gray-500 py-2">Wed</div>
                    <div class="text-center text-xs font-semibold text-gray-500 py-2">Thu</div>
                    <div class="text-center text-xs font-semibold text-gray-500 py-2">Fri</div>
                    <div class="text-center text-xs font-semibold text-gray-500 py-2">Sat</div>
                </div>

                <div id="calendarGrid" class="grid grid-cols-7 gap-2">
                    <!-- Calendar days will be generated dynamically -->
                </div>
            </div>

            <!-- Conversation History -->
            <div class="bg-white p-6 rounded-3xl shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-900">Recent Conversations</h3>
                    <button id="viewAllBtn" class="text-xs text-primary font-semibold hover:underline">View All</button>
                </div>
                <div id="appointmentsList" class="space-y-4 max-h-96 overflow-y-auto">
                    <!-- Conversations will be loaded dynamically -->
                </div>

                <a href="chatbot.html" class="block w-full mt-6 bg-primary text-white py-3 rounded-xl font-semibold hover:bg-primary-dark transition-colors text-center">
                    <i class="fas fa-plus mr-2"></i> Start New Chat
                </a>
            </div>
        </div>
    </main>

    <script>
        // Sample conversation history data
        let appointments = [
            { id: 1, name: "CogniWave AI", type: "AI Assistant", topic: "Health Assessment", time: "09:15 AM", date: "2026-01-24", icon: "robot", color: "purple" },
            { id: 2, name: "Dr. Arun Kumar", type: "Cardiologist", topic: "Heart Rate Analysis", time: "11:45 AM", date: "2026-01-24", icon: "user-md", color: "blue" },
            { id: 3, name: "CogniWave AI", type: "AI Assistant", topic: "Medication Reminder", time: "02:30 PM", date: "2026-01-24", icon: "robot", color: "purple" },
            { id: 4, name: "Dr. Arun Kumar", type: "Cardiologist", topic: "Blood Pressure Discussion", time: "04:15 PM", date: "2026-01-23", icon: "user-md", color: "blue" },
            { id: 5, name: "CogniWave AI", type: "AI Assistant", topic: "Exercise Recommendations", time: "10:30 AM", date: "2026-01-23", icon: "robot", color: "purple" },
            { id: 6, name: "CogniWave AI", type: "AI Assistant", topic: "Sleep Quality Check", time: "08:20 AM", date: "2026-01-22", icon: "robot", color: "purple" },
            { id: 7, name: "Dr. Arun Kumar", type: "Cardiologist", topic: "Weekly Consultation", time: "03:00 PM", date: "2026-01-22", icon: "user-md", color: "blue" }
        ];

        let currentDate = new Date(2026, 0, 24); // January 24, 2026

        // Generate calendar
        function generateCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const today = new Date(2026, 0, 24);
            
            // Update month display
            const monthNames = ["January", "February", "March", "April", "May", "June",
                              "July", "August", "September", "October", "November", "December"];
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
            
            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const dayDiv = document.createElement('div');
                dayDiv.className = 'aspect-square p-2 text-center text-gray-400 text-sm';
                dayDiv.textContent = day;
                grid.appendChild(dayDiv);
            }
            
            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDiv = document.createElement('div');
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                
                dayDiv.className = `aspect-square p-2 text-center text-sm cursor-pointer ${
                    isToday 
                        ? 'bg-primary text-white rounded-lg font-bold' 
                        : 'text-gray-800 hover:bg-gray-100 rounded-lg'
                }`;
                dayDiv.textContent = day;
                
                // Add dot if there are appointments
                const hasAppt = appointments.some(a => {
                    const apptDate = new Date(a.date);
                    return apptDate.getDate() === day && apptDate.getMonth() === month;
                });
                
                if (hasAppt && !isToday) {
                    dayDiv.innerHTML = `${day}<span class="block w-1 h-1 bg-primary rounded-full mx-auto mt-1"></span>`;
                }
                
                grid.appendChild(dayDiv);
            }
        }

        // Display conversations
        function displayAppointments() {
            const list = document.getElementById('appointmentsList');
            
            // Sort conversations by date and time (most recent first)
            const sortedAppts = [...appointments].sort((a, b) => {
                const dateA = new Date(a.date + ' ' + a.time);
                const dateB = new Date(b.date + ' ' + b.time);
                return dateB - dateA;
            });
            
            if (sortedAppts.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500 py-8">No conversations yet</p>';
                return;
            }
            
            const today = new Date(2026, 0, 24).toISOString().split('T')[0];
            
            list.innerHTML = sortedAppts.map((conv) => {
                // Format date for display
                const convDate = new Date(conv.date);
                const dateStr = convDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const isToday = conv.date === today;
                
                // Set colors based on type
                const isPurple = conv.color === 'purple';
                const bgClass = isPurple ? 'bg-purple-50' : 'bg-blue-50';
                const borderClass = isPurple ? 'border-purple-500' : 'border-blue-500';
                const textClass = isPurple ? 'text-purple-600' : 'text-blue-600';
                const iconBgClass = isPurple ? 'bg-purple-100' : 'bg-blue-100';
                const badgeClass = isPurple ? 'bg-purple-600' : 'bg-blue-600';
                
                const targetUrl = conv.color === 'purple' ? 'chatbot.html' : 'history.html';
                
                return `
                    <div class="border-l-4 ${borderClass} ${bgClass} p-4 rounded-lg relative cursor-pointer hover:shadow-md transition-shadow" onclick="window.location.href='${targetUrl}'">
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-full ${iconBgClass} flex items-center justify-center ${textClass} flex-shrink-0">
                                <i class="fas fa-${conv.icon}"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between mb-1">
                                    <h4 class="font-bold text-sm text-gray-900">${conv.name}</h4>
                                    <span class="text-xs text-gray-500 ml-2">${conv.time}</span>
                                </div>
                                <span class="inline-block ${badgeClass} text-white text-[10px] font-semibold px-2 py-0.5 rounded mb-1">
                                    ${conv.type}
                                </span>
                                <p class="text-xs text-gray-600 mt-1">${conv.topic}</p>
                                <p class="text-xs text-gray-400 mt-1">
                                    ${isToday ? '<span class="font-semibold text-primary">Today</span>' : dateStr}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Month navigation
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            generateCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            generateCalendar();
        });

        // Initialize
        generateCalendar();
        displayAppointments();
    </script>
    <script src="dashboard.js"></script>
</body>
</html>
